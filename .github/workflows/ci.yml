name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv build --no-sources
      - name: Verify core without optional dependencies
        run: |
          wheel=$(echo dist/dataioc-*.whl)
          uv run --isolated --no-project --with "$wheel" python -c "import sys, dataioc; from dataioc import *; assert 'numpy' not in sys.modules"

  numpy-compatibility:
    name: NumPy ${{ matrix.numpy }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            numpy: "numpy==1.26.0"
          - python-version: "3.9"
            numpy: "numpy>=1.26,<2"
          - python-version: "3.9"
            numpy: "numpy==2.0.0"
          - python-version: "3.14"
            numpy: "numpy>=2,<3"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      NUMPY_REQUIREMENT: ${{ matrix.numpy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: >-
          uv pip install --python .venv/bin/python --upgrade
          --default-index https://pypi.org/simple "$NUMPY_REQUIREMENT"
      - run: uv run --no-sync python -c "import numpy; print(numpy.__version__)"
      - run: uv run --no-sync pytest -W error::DeprecationWarning
