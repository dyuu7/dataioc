name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv build --no-sources
      - name: Verify core without optional dependencies
        run: >-
          uv run --isolated --no-project --with ./dist/dataioc-0.1.0-py3-none-any.whl
          python -c "import sys, dataioc; from dataioc import *; assert 'numpy' not in sys.modules"
