site_name: dataioc
site_description: Declarative data dependencies and on-demand computation for Python.
site_url: https://dyuu7.github.io/dataioc/
repo_url: https://github.com/dyuu7/dataioc
repo_name: dyuu7/dataioc

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Quickstart: 快速开始
            Concepts: 核心概念
            Providers: Provider
            "Indexed data": 索引数据
            "NumPy support": NumPy 支持
            API: API
            Maintenance: 维护
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            members_order: source
            show_source: false
            show_root_heading: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Providers: providers.md
  - Indexed data: indexed-data.md
  - NumPy support: numpy.md
  - API: api.md
  - Maintenance: maintenance.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables

strict: true
