[project]
name = "dataioc"
version = "0.1.0"
description = "Declarative data dependencies and on-demand computation for Python."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yanang007" }, { name = "dyuu7" }]
maintainers = [{ name = "dyuu7" }]
keywords = ["IoC", "data", "dependency injection", "lazy", "providers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.10.0; python_version < '3.11'"]

[project.urls]
Documentation = "https://dyuu7.github.io/dataioc/"
Issues = "https://github.com/dyuu7/dataioc/issues"
Repository = "https://github.com/dyuu7/dataioc"

[project.optional-dependencies]
numpy = ["numpy>=1.26,<3"]

[dependency-groups]
dev = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5",
  "mkdocs-static-i18n>=1.3,<2",
  "mkdocstrings[python]>=0.25",
  "numpy>=1.26,<3",
  "pyright>=1.1.390",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["dataioc"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataioc"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/README.zh-CN.md",
  "/LICENSE",
  "/docs",
  "/mkdocs.yml",
  "/pyproject.toml",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
