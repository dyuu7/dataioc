[project]
name = "dataioc"
version = "0.1.0"
description = "Lazy data dependency injection with weak/strong IDs, provider overrides, and dependency tree diagnostics."
requires-python = ">=3.10"
dependencies = ["typing-extensions>=4.10.0; python_version < '3.11'"]
authors = [{ name = "yanang007" }, { name = "dyuu7" }]
maintainers = [{ name = "dyuu7" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dependency injection", "IoC", "data", "lazy", "providers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
numpy = ["numpy>=1.26"]

[project.urls]
Issues = "https://github.com/dyuu7/dataioc/issues"
Repository = "https://github.com/dyuu7/dataioc"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.2",
    "numpy>=1.26",
    "pyright>=1.1.390",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataioc"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/README.md", "/CONTRIBUTORS.md", "/LICENSE",
    "/pyproject.toml",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dataioc"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = false
